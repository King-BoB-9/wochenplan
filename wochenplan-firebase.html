<style>
  html, body { margin: 0; padding: 0; background: #1f2e28; }
  .wp-app {
    --bg: #1f2e28; --bg-soft: #26392f; --paper: #f3ecd9; --paper-soft: #ece2c8;
    --ink: #241f16; --ink-soft: #6b6350; --yolk: #e7b23d; --rust: #b14b32; --sage: #7e9673;
    --line: rgba(243,236,217,0.16); --line-paper: rgba(36,31,22,0.12);

  .wp-app * { box-sizing: border-box; }

  .wp-header p { margin: 0; color: rgba(243,236,217,0.6); font-size: 13.5px; }

  .wp-stepper { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .wp-stepper button { background: transparent; border: none; color: var(--paper); width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .wp-stepper button:hover { background: var(--bg-soft); }
  .wp-stepper span { width: 32px; text-align: center; font-variant-numeric: tabular-nums; }

  .wp-tabs { display: flex; gap: 22px; padding: 0 20px; margin-top: 18px; border-bottom: 1px solid var(--line); }
  .wp-tab { background: none; border: none; color: rgba(243,236,217,0.55); font-size: 14.5px; padding: 10px 0 12px; cursor: pointer; border-bottom: 2px solid transparent; font-family: inherit; }
  .wp-tab.active { color: var(--paper); border-bottom-color: var(--yolk); }

  .wp-section { padding: 20px; }

  .wp-weekswitch { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
  .wp-weekpill { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; flex: 1; }
  .wp-weekpill button { flex: 1; background: transparent; border: none; color: rgba(243,236,217,0.6); font-size: 13.5px; padding: 9px 0; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .wp-weekpill button.active { background: var(--paper); color: var(--ink); font-weight: 600; }

  .wp-carry-banner { background: var(--bg-soft); border: 1px solid rgba(231,178,61,0.35); border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .wp-carry-text { display: flex; align-items: center; gap: 8px; font-size: 13.5px; color: var(--yolk); }
  .wp-carry-btn { background: var(--yolk); color: var(--ink); border: none; border-radius: 7px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px; font-family: inherit; }

  .wp-day { background: var(--paper); color: var(--ink); border-radius: 10px; margin-bottom: 10px; overflow: hidden; }
  .wp-day-row { display: flex; align-items: center; justify-content: space-between; padding: 13px 16px; cursor: pointer; }
  .wp-day-name { font-size: 12.5px; color: var(--ink-soft); width: 84px; font-style: italic; }

  .wp-day-meta { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
  .wp-day-chevron { transition: transform 0.15s ease; color: var(--ink-soft); flex-shrink: 0; margin-left: 8px; display: flex; }

  .wp-search-box { display: flex; align-items: center; gap: 8px; background: var(--paper-soft); border-radius: 7px; padding: 8px 10px; margin-bottom: 10px; }

  .wp-day-results { max-height: 220px; overflow-y: auto; }
  .wp-day-result { display: block; width: 100%; text-align: left; background: none; border: none; padding: 8px 4px; font-size: 14px; color: var(--ink); cursor: pointer; border-radius: 6px; font-family: inherit; }
  .wp-day-result:hover { background: var(--paper-soft); }
  .wp-day-result-sub { color: var(--ink-soft); font-size: 12px; }
  .wp-day-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .wp-day-added { margin-bottom: 10px; }
  .wp-day-added-item { display: flex; align-items: center; justify-content: space-between; background: var(--paper-soft); border-radius: 7px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; }
  .wp-day-added-item span { font-weight: 600; }

  .wp-btn-ghost, .wp-btn-primary { border-radius: 7px; padding: 8px 14px; font-size: 13.5px; cursor: pointer; border: none; font-family: inherit; }
  .wp-btn-ghost { background: transparent; border: 1px solid var(--line-paper); color: var(--ink); }
  .wp-btn-primary { background: var(--ink); color: var(--paper); display: inline-flex; align-items: center; gap: 6px; }
  .wp-btn-primary:disabled { opacity: 0.4; cursor: default; }
  .wp-text-btn { background: none; border: none; color: var(--sage); font-size: 13.5px; display: inline-flex; align-items: center; gap: 5px; cursor: pointer; padding: 4px 0; font-family: inherit; }
  .wp-text-btn.wp-danger { color: var(--rust); }
  .wp-clear-btn { background: none; border: none; color: var(--rust); font-size: 13px; cursor: pointer; font-family: inherit; }

  .wp-sugg { background: var(--bg-soft); border-radius: 10px; padding: 14px 16px; margin-top: 4px; }
  .wp-sugg-head { display: flex; align-items: center; gap: 7px; color: var(--yolk); font-size: 13.5px; margin-bottom: 10px; }
  .wp-sugg-item { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 0; border-top: 1px solid var(--line); }

  .wp-sugg-name { font-size: 14px; }

  .wp-sugg-leftover-text { font-size: 11.5px; color: var(--yolk); margin-top: 2px; }

  .wp-box-add { display: flex; justify-content: flex-end; margin-bottom: 12px; }
  .wp-box-grid { display: flex; flex-direction: column; gap: 8px; }
  .wp-box-card { background: var(--paper); color: var(--ink); border-radius: 9px; padding: 12px 14px; display: flex; align-items: center; justify-content: space-between; gap: 10px; cursor: pointer; }
  .wp-box-card-name { font-weight: 600; font-size: 14.5px; }
  .wp-box-card-sub { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .wp-box-card-tags { font-size: 11.5px; color: var(--sage); margin-top: 2px; }
  .wp-box-card-icons { display: flex; align-items: center; gap: 8px; color: var(--ink-soft); flex-shrink: 0; }
  .wp-ingdb-card { background: var(--paper); color: var(--ink); border-radius: 9px; padding: 12px 14px; margin-bottom: 8px; }
  .wp-ingdb-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .wp-merge-panel { border-top: 1px solid var(--line-paper); margin-top: 10px; padding-top: 10px; }

  .wp-confirm-actions { display: flex; gap: 8px; justify-content: flex-end; }

  .wp-cat { margin-bottom: 18px; }
  .wp-cat-title { font-size: 12.5px; font-style: italic; color: var(--yolk); margin-bottom: 8px; }

  .wp-icon-btn { background: none; border: none; color: inherit; cursor: pointer; padding: 4px; display: flex; }

  .wp-modal-body { padding: 16px 18px; }

  .wp-ing-name { flex: 1; min-width: 0; border: 1px solid var(--line-paper); border-radius: 6px; padding: 9px 8px; font-size: 16px; font-family: inherit; }

  .wp-ing-unit { width: 84px; border: 1px solid var(--line-paper); border-radius: 6px; padding: 9px 4px; font-size: 15px; font-family: inherit; background: white; }
  .wp-ing-pkg-wrap { display: flex; align-items: center; gap: 4px; }

  .wp-ing-pkg { width: 64px; border: 1px solid var(--line-paper); border-radius: 6px; padding: 9px 6px; font-size: 16px; font-family: inherit; }
  .wp-ing-cat { flex: 1; min-width: 120px; border: 1px solid var(--line-paper); border-radius: 6px; padding: 9px 4px; font-size: 15px; font-family: inherit; background: white; }
  .wp-ing-hint { font-size: 12px; color: var(--ink-soft); font-style: italic; margin: -2px 0 8px; }

  .wp-ing-suggest { background: var(--paper-soft); border-radius: 7px; margin: -4px 0 8px; overflow: hidden; border: 1px solid var(--line-paper); }
  .wp-ing-suggest-item { display: block; width: 100%; text-align: left; background: none; border: none; border-top: 1px solid var(--line-paper); padding: 8px 10px; font-size: 14px; color: var(--ink); cursor: pointer; font-family: inherit; }
  .wp-ing-suggest-item:first-child { border-top: none; }
  .wp-ing-suggest-item:hover { background: white; }
  .wp-ing-suggest-meta { color: var(--ink-soft); font-size: 12px; }
  .wp-modal-foot { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; border-top: 1px solid var(--line-paper); }
  .wp-modal-foot-actions { display: flex; gap: 8px; }

  .wp-footer-note { text-align: center; font-size: 11.5px; color: rgba(243,236,217,0.35); font-style: italic; padding: 24px 20px 4px; }
</style>

function buildInitialRecipes(){
  return recipesData.map(function(row){
    var name = row[0], addedBy = row[1], tags = row[2], ings = row[3], url = row[4];
    return {
      id: uid('r'), name: name, addedBy: addedBy, tags: tags, servings: 4, url: url,
      ingredients: ings.map(function(i){ return { id: uid('ing'), name: i[0], amount: i[1], unit: i[2], category: i[3], pkg: null }; })
    };
  });
}

function buildInitialIngredientDB(recipes){
  var map = {};
  recipes.forEach(function(r){
    r.ingredients.forEach(function(ing){
      var key = ing.name.toLowerCase() + '|' + ing.unit;
      if(!map[key]) map[key] = { id: uid('ingdb'), name: ing.name, unit: ing.unit, category: ing.category, pkg: ing.pkg || null };
    });
  });
  return Object.values(map).sort(function(a,b){ return a.name.localeCompare(b.name, 'de'); });
}

// Handkuratierte Begriffsgruppen, damit z. B. "Hackfleisch" auch "Hackepeter" vorschlägt.
// Kann hier erweitert werden — einfach weitere Zeilen ergänzen.
var INGREDIENT_SYNONYMS = {
  'hackfleisch': ['hackepeter', 'mett', 'tatar', 'faschiertes', 'gehacktes', 'rinderhack', 'schweinehack'],
  'sahne': ['schlagsahne', 'kochsahne', 'creme fraiche', 'crème fraîche', 'schmand'],
  'käse': ['reibekäse', 'gouda', 'emmentaler', 'cheddar', 'mozzarella', 'parmesan', 'feta'],
  'kartoffel': ['kartoffeln', 'erdapfel'],
  'zwiebel': ['zwiebeln', 'schalotte', 'schalotten'],
  'tomate': ['tomaten', 'passierte tomaten', 'tomatenmark', 'cocktailtomaten'],
  'nudeln': ['pasta', 'spaghetti', 'spätzle', 'gnocchi'],
  'wurst': ['würstchen', 'bratwurst', 'wiener würstchen', 'chorizo'],
  'fisch': ['lachs', 'fischstäbchen', 'forelle', 'garnelen'],
  'gemüse': ['möhre', 'karotte', 'karotten', 'paprika', 'zucchini', 'brokkoli']
};
function relatedTerms(term){
  var out = new Set([term]);
  Object.keys(INGREDIENT_SYNONYMS).forEach(function(key){
    var group = [key].concat(INGREDIENT_SYNONYMS[key]);
    if(group.indexOf(term) > -1){ group.forEach(function(g){ out.add(g); }); }
  });
  return Array.from(out);
}
function findIngredientSuggestions(ingredientDB, query){
  var q = query.toLowerCase().trim();
  if(!q) return [];
  var terms = relatedTerms(q);
  var direct = [], related = [];
  ingredientDB.forEach(function(item){
    var n = item.name.toLowerCase();
    if(n.indexOf(q) > -1 || q.indexOf(n) > -1){ direct.push(item); return; }
    var isRelated = terms.some(function(t){ return t !== q && n.indexOf(t) > -1; });
    if(isRelated) related.push(item);
  });
  return direct.concat(related).slice(0, 8).map(function(item, i){ return { item: item, related: i >= direct.length }; });
}
function mergeIngredient(ingredientDB, recipes, fromId, toId){
  var from = ingredientDB.find(function(x){ return x.id === fromId; });
  var to = ingredientDB.find(function(x){ return x.id === toId; });
  if(!from || !to || from.id === to.id) return { ingredientDB: ingredientDB, recipes: recipes };
  var fromName = from.name.toLowerCase();
  recipes.forEach(function(r){
    r.ingredients.forEach(function(ing){
      // Nur der Name (und die Kategorie) wird ersetzt — Menge und Einheit im Rezept bleiben unangetastet.
      if(ing.name.toLowerCase() === fromName){
        ing.name = to.name; ing.category = to.category;
      }
    });
  });
  return { ingredientDB: ingredientDB.filter(function(x){ return x.id !== fromId; }), recipes: recipes };
}

function emptyDays(){
  var d = {};
  DAYS.forEach(function(day){ d[day] = { recipeIds: [] }; });
  return d;
}
function migrateDays(days){
  var out = {};
  DAYS.forEach(function(day){
    var info = days && days[day];
    if(info && Array.isArray(info.recipeIds)){ out[day] = { recipeIds: info.recipeIds.slice() }; }
    else if(info && info.recipeId){ out[day] = { recipeIds: [info.recipeId] }; }
    else { out[day] = { recipeIds: [] }; }
  });
  return out;
}
function emptyPlan(){ return { persons: 4, days: emptyDays() }; }

function signals(r){
  var s = new Set();
  (r.tags || []).forEach(function(t){ s.add(t); });
  (r.ingredients || []).forEach(function(i){ s.add(i.name.toLowerCase()); });
  return s;
}

function getSuggestions(recipes, days, leftovers){
  var plannedIds = [];
  Object.keys(days).forEach(function(d){ (days[d].recipeIds || []).forEach(function(id){ plannedIds.push(id); }); });
  leftovers = leftovers || [];
  if(!plannedIds.length && !leftovers.length) return [];
  var planned = new Set();
  plannedIds.forEach(function(id){
    var r = recipes.find(function(x){ return x.id === id; });
    if(r) signals(r).forEach(function(s){ planned.add(s); });
  });
  return recipes
    .filter(function(r){ return plannedIds.indexOf(r.id) === -1; })
    .map(function(r){
      var score = 0;
      signals(r).forEach(function(s){ if(planned.has(s)) score++; });
      var matched = leftovers.filter(function(lo){
        var ln = lo.name.toLowerCase();
        return r.ingredients.some(function(ing){
          var n = ing.name.toLowerCase();
          return n.indexOf(ln) > -1 || ln.indexOf(n) > -1;
        });
      });
      score += matched.length * 5;
      return { recipe: r, score: score, leftoverMatches: matched };
    })
    .filter(function(x){ return x.score > 0; })
    .sort(function(a,b){ return b.score - a.score; })
    .slice(0, 6);
}

function buildShoppingList(recipes, plan){
  var map = {};
  var missing = [];
  Object.keys(plan.days).forEach(function(day){
    var ids = plan.days[day].recipeIds || [];
    ids.forEach(function(rid){
      var r = recipes.find(function(x){ return x.id === rid; });
      if(!r) return;
      if(!r.ingredients.length){ missing.push(r.name); return; }
      var factor = plan.persons / (r.servings || 4);
      r.ingredients.forEach(function(ing){
        var key = ing.name.toLowerCase() + '|' + ing.unit;
        if(!map[key]) map[key] = { name: ing.name, unit: ing.unit, amount: 0, category: ing.category || 'Sonstiges', pkg: null };
        map[key].amount += (Number(ing.amount) || 0) * factor;
        if(!map[key].pkg && ing.pkg) map[key].pkg = Number(ing.pkg);
      });
    });
  });
  var items = Object.keys(map).map(function(k){
    var i = map[k];
    var out = { name: i.name, unit: i.unit, category: i.category, amount: Math.round(i.amount * 10) / 10 };
    if(i.pkg && i.pkg > 0){
      var packages = Math.ceil(i.amount / i.pkg);
      var bought = packages * i.pkg;
      out.pkg = i.pkg;
      out.packages = packages;
      out.leftover = Math.round((bought - i.amount) * 10) / 10;
    }
    return out;
  }).sort(function(a,b){ return a.name.localeCompare(b.name, 'de'); });
  var byCategory = {};
  items.forEach(function(i){
    if(!byCategory[i.category]) byCategory[i.category] = [];
    byCategory[i.category].push(i);
  });
  var leftovers = items.filter(function(i){ return i.leftover > 0; }).map(function(i){ return { name: i.name, unit: i.unit, leftover: i.leftover }; });
  return { byCategory: byCategory, missing: Array.from(new Set(missing)), leftovers: leftovers };
}

function isConfigured(){
  return firebaseConfig.apiKey && firebaseConfig.apiKey.indexOf('HIER_') !== 0 &&
    HOUSEHOLD_ID && HOUSEHOLD_ID.indexOf('HIER_') !== 0;
}

function initCloud(){
  if(!isConfigured()){
    cloud.error = 'config';
    render();
    return;
  }
  try{
    var app = initializeApp(firebaseConfig);
    var auth = getAuth(app);
    var db = getFirestore(app);
    cloud.docRef = doc(db, 'households', HOUSEHOLD_ID);

    onAuthStateChanged(auth, function(user){
      if(!user) return;
      onSnapshot(cloud.docRef, function(snap){
        cloud.applyingRemote = true;
        if(snap.exists()){
          var d = snap.data();
          recipes = (d.recipes && d.recipes.length) ? d.recipes : buildInitialRecipes();
          plan = d.plan || emptyPlan();
          plan.days = migrateDays(plan.days);
          nextPlan = d.nextPlan || { days: emptyDays() };
          nextPlan.days = migrateDays(nextPlan.days);
          ingredientDB = (d.ingredientDB && d.ingredientDB.length) ? d.ingredientDB : buildInitialIngredientDB(recipes);
        } else {
          recipes = buildInitialRecipes();
          plan = emptyPlan();
          nextPlan = { days: emptyDays() };
          ingredientDB = buildInitialIngredientDB(recipes);
          setDoc(cloud.docRef, { recipes: recipes, plan: plan, nextPlan: nextPlan, ingredientDB: ingredientDB }).catch(function(e){ cloud.error = e.message; });
        }
        cloud.ready = true;
        cloud.applyingRemote = false;
        render();
      }, function(err){
        cloud.error = err.message;
        render();
      });
    });

    signInAnonymously(auth).catch(function(e){ cloud.error = e.message; render(); });
  } catch(e){
    cloud.error = e.message;
    render();
  }
}

function saveState(){
  if(cloud.applyingRemote || !cloud.docRef) return;
  setDoc(cloud.docRef, { recipes: recipes, plan: plan, nextPlan: nextPlan, ingredientDB: ingredientDB }).catch(function(e){

}

  var cats = Object.keys(shopping.byCategory);
  if(!cats.length){ html += '<p class="wp-empty">Noch keine Zutaten in der Liste — plant Gerichte für „Diese Woche“ ein.</p>'; }
  cats.forEach(function(cat){
    html += '<div class="wp-cat"><div class="wp-cat-title">' + esc(cat) + '</div>';
    shopping.byCategory[cat].forEach(function(item){
      var key = item.name + item.unit;
      var isDone = !!ui.checked[key];
      var amountLabel = item.amount + ' ' + esc(item.unit);
      var subLabel = '';
      if(item.packages){
        amountLabel = item.packages + ' × ' + item.pkg + ' ' + esc(item.unit) + ' <span class="wp-item-need">(' + item.amount + ' ' + esc(item.unit) + ' nötig)</span>';
        if(item.leftover > 0) subLabel = '<div class="wp-item-leftover">+' + item.leftover + ' ' + esc(item.unit) + ' Rest übrig</div>';
      }
      html += '<div class="wp-item ' + (isDone?'done':'') + '" data-action="toggle-checked" data-key="' + esc(key) + '">' +
        '<span class="wp-checkbox ' + (isDone?'on':'') + '">' + (isDone?ICONS.check:'') + '</span>' +
        '<span class="wp-item-name">' + esc(item.name) + subLabel + '</span>' +
        '<span class="wp-item-amount">' + amountLabel + '</span></div>';
    });
    html += '</div>';
  });
  if(shopping.missing.length){
    html += '<div class="wp-missing"><strong>Zutaten fehlen noch für:</strong> ' + shopping.missing.map(esc).join(', ') + '. Öffnet das Rezept in der Rezeptbox, um sie zu ergänzen.</div>';
  }
  html += '</div>';
  return html;
}
function renderModal(){
  var m = ui.modal;
  var ingHtml = '';
  var missingPkgCount = 0;
  if(!m.ingredients.length){
    ingHtml = '<p class="wp-muted-note">Noch keine Zutaten hinterlegt — dann fehlt dieses Rezept später in der Einkaufsliste.</p>';
  }
  m.ingredients.forEach(function(ing, idx){
    if(ing.name.trim() && !ing.pkg) missingPkgCount++;
    ingHtml += '<div class="wp-ing-card">' +
      '<div class="wp-ing-row-top">' +
        '<input id="ing-name-' + idx + '" class="wp-ing-name" placeholder="Zutat" autocomplete="off" data-field="ing-name" data-idx="' + idx + '" value="' + esc(ing.name) + '">' +
        '<button class="wp-icon-btn" data-action="remove-ingredient" data-idx="' + idx + '">' + ICONS.trash + '</button>' +
      '</div>';
    if(ui.modal.activeSuggestIdx === idx){
      var suggs = findIngredientSuggestions(ingredientDB, ing.name);
      if(suggs.length){
        ingHtml += '<div class="wp-ing-suggest">';
        suggs.forEach(function(s){
          ingHtml += '<button class="wp-ing-suggest-item" data-action="pick-ingredient" data-idx="' + idx + '" data-ingid="' + s.item.id + '">' +
            esc(s.item.name) + ' <span class="wp-ing-suggest-meta">' + (s.item.pkg ? ('à ' + s.item.pkg + ' ' + esc(s.item.unit)) : esc(s.item.unit)) + (s.related ? ' · ähnlich' : '') + '</span>' +
          '</button>';
        });
        ingHtml += '</div>';
      }
    }
    ingHtml +=
      '<div class="wp-ing-row-bottom">' +
        '<input id="ing-amount-' + idx + '" class="wp-ing-amount" type="number" step="0.1" inputmode="decimal" placeholder="Menge" data-field="ing-amount" data-idx="' + idx + '" value="' + esc(String(ing.amount)) + '">' +
        '<select id="ing-unit-' + idx + '" class="wp-ing-unit" data-field="ing-unit" data-idx="' + idx + '">' +
          UNITS.map(function(u){ return '<option value="' + u + '" ' + (u===ing.unit?'selected':'') + '>' + u + '</option>'; }).join('') +
        '</select>' +
        '<div class="wp-ing-pkg-wrap"><span>à</span><input id="ing-pkg-' + idx + '" class="wp-ing-pkg' + (!ing.pkg && ing.name.trim() ? ' wp-ing-pkg-missing' : '') + '" type="number" step="0.1" inputmode="decimal" placeholder="Pkg." title="Packungsgröße — z. B. 400 wenn im 400g-Beutel verkauft" data-field="ing-pkg" data-idx="' + idx + '" value="' + (ing.pkg ? esc(String(ing.pkg)) : '') + '"></div>' +
        '<select id="ing-cat-' + idx + '" class="wp-ing-cat" data-field="ing-cat" data-idx="' + idx + '">' +
          CATEGORIES.map(function(c){ return '<option value="' + c + '" ' + (c===ing.category?'selected':'') + '>' + c + '</option>'; }).join('') +
        '</select>' +
      '</div>' +
    '</div>';
  });
  return '<div class="wp-modal-backdrop" id="modalBackdrop">' +
    '<div class="wp-modal">' +
      '<div class="wp-modal-head"><h3>' + (m.editingId ? 'Rezept bearbeiten' : 'Neues Rezept') + '</h3><button class="wp-icon-btn" data-action="modal-close">' + ICONS.x + '</button></div>' +
      '<div class="wp-modal-body">' +
        '<label class="wp-field"><span>Name</span><input id="modalName" value="' + esc(m.name) + '" placeholder="z. B. Ofengemüse"></label>' +
        '<div class="wp-field-row">' +
          '<label class="wp-field"><span>Hinzugefügt von</span><input id="modalAddedBy" value="' + esc(m.addedBy) + '" placeholder="Name"></label>' +
          '<label class="wp-field wp-field-narrow"><span>Portionen (Basis)</span><input id="modalServings" type="number" min="1" value="' + esc(String(m.servings)) + '"></label>' +
        '</div>' +
        '<label class="wp-field"><span>Stichworte <em>(kommagetrennt, hilft bei Vorschlägen)</em></span><input id="modalTags" value="' + esc(m.tagsText) + '" placeholder="z. B. kartoffel, hackfleisch"></label>' +
        '<label class="wp-field"><span>Link zum Rezept <em>(optional)</em></span><input id="modalUrl" value="' + esc(m.url) + '" placeholder="https://..."></label>' +
        '<div class="wp-ing-head"><span>Zutaten <em>für ' + esc(String(m.servings || 4)) + ' Personen</em></span><button class="wp-text-btn" data-action="add-ingredient">' + ICONS.plus + ' Zutat</button></div>' +
        '<p class="wp-ing-hint">Tippt einen Namen — Vorschläge aus der Zutaten-Datenbank erscheinen darunter. „à" ist die Packungsgröße im Laden (z. B. 400 bei einem 400g-Beutel) — bitte für jede Zutat angeben, damit die Einkaufsliste genau rechnet.</p>' +
        (missingPkgCount ? '<p class="wp-ing-warning">' + missingPkgCount + ' Zutat' + (missingPkgCount>1?'en':'') + ' ohne Packungsgröße — Speichern geht trotzdem, die Einkaufsliste rechnet dafür nur den reinen Bedarf.</p>' : '') +
        ingHtml +
      '</div>' +
      '<div class="wp-modal-foot">' +
        (m.editingId ? '<button class="wp-text-btn wp-danger" data-action="modal-delete">' + ICONS.trash + ' Rezept löschen</button>' : '<span></span>') +
        '<div class="wp-modal-foot-actions">' +
          '<button class="wp-btn-ghost" data-action="modal-close">Abbrechen</button>' +
          '<button class="wp-btn-primary" data-action="modal-save"' + (!m.name.trim() ? ' disabled' : '') + '>Speichern</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function renderSetupNotice(){
  return '<div class="wp-section"><div class="wp-missing" style="margin-top:20px;">' +
    '<strong>Noch nicht eingerichtet.</strong> Trag oben im Code (Abschnitt „FIREBASE-EINRICHTUNG“) euer <code>firebaseConfig</code> und einen eigenen <code>HOUSEHOLD_ID</code>-Code ein, dann speichert und lädt die App geräteübergreifend.' +
    '</div></div>';
}
function renderCloudError(msg){
  return '<div class="wp-section"><div class="wp-missing" style="margin-top:20px;">' +
    '<strong>Verbindung fehlgeschlagen.</strong> ' + esc(msg) + '<br><br>Prüft: Ist die Firestore-Datenbank angelegt, ist „Anonym“ als Anmeldemethode aktiviert und sind die Firestore-Regeln veröffentlicht?' +
    '</div></div>';
}
function renderLoading(){
  return '<div class="wp-section"><p class="wp-empty">Verbinde …</p></div>';
}
function renderIngEditModal(){
  var m = ui.ingEdit;
  return '<div class="wp-modal-backdrop" id="ingEditBackdrop">' +
    '<div class="wp-modal">' +
      '<div class="wp-modal-head"><h3>' + (m.editingId ? 'Zutat bearbeiten' : 'Neue Zutat') + '</h3><button class="wp-icon-btn" data-action="ing-edit-close">' + ICONS.x + '</button></div>' +
      '<div class="wp-modal-body">' +
        '<label class="wp-field"><span>Name</span><input id="ingEditName" value="' + esc(m.name) + '" placeholder="z. B. Hackfleisch gemischt"></label>' +
        '<div class="wp-field-row">' +
          '<label class="wp-field"><span>Einheit</span><select id="ingEditUnit">' + UNITS.map(function(u){ return '<option value="' + u + '" ' + (u===m.unit?'selected':'') + '>' + u + '</option>'; }).join('') + '</select></label>' +
          '<label class="wp-field wp-field-narrow"><span>Packungsgröße</span><input id="ingEditPkg" type="number" step="0.1" inputmode="decimal" placeholder="z. B. 400" value="' + esc(String(m.pkg)) + '"></label>' +
        '</div>' +
        '<label class="wp-field"><span>Kategorie</span><select id="ingEditCategory">' + CATEGORIES.map(function(c){ return '<option value="' + c + '" ' + (c===m.category?'selected':'') + '>' + c + '</option>'; }).join('') + '</select></label>' +
      '</div>' +
      '<div class="wp-modal-foot">' +
        (m.editingId ? '<button class="wp-text-btn wp-danger" data-action="ing-edit-delete">' + ICONS.trash + ' Löschen</button>' : '<span></span>') +
        '<div class="wp-modal-foot-actions">' +
          '<button class="wp-btn-ghost" data-action="ing-edit-close">Abbrechen</button>' +
          '<button class="wp-btn-primary" data-action="ing-edit-save"' + (!m.name.trim() ? ' disabled' : '') + '>Speichern</button>' +
        '</div>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function renderConfirmMergeModal(){
  var cm = ui.confirmMerge;
  var from = ingredientDB.find(function(x){ return x.id === cm.fromId; });
  var to = ingredientDB.find(function(x){ return x.id === cm.toId; });
  return '<div class="wp-confirm-backdrop">' +
    '<div class="wp-confirm-box">' +
      '<h3>Zutat wirklich ersetzen?</h3>' +
      '<p>„' + esc(from ? from.name : '') + '“ wird in <strong>allen Rezepten</strong> durch „' + esc(to ? to.name : '') + '“ ersetzt. Mengen und Einheiten in den Rezepten bleiben dabei unverändert. Das kann nicht rückgängig gemacht werden.</p>' +
      '<div class="wp-confirm-actions">' +
        '<button class="wp-btn-ghost" data-action="cancel-merge">Abbrechen</button>' +
        '<button class="wp-btn-primary" data-action="confirm-merge">Ja, ersetzen</button>' +
      '</div>' +
    '</div>' +
  '</div>';
}
function render(){
  var app = document.getElementById('app');
  if(cloud.error === 'config'){ app.innerHTML = renderHeader() + renderTabs() + renderSetupNotice(); return; }
  if(cloud.error){ app.innerHTML = renderHeader() + renderTabs() + renderCloudError(cloud.error); return; }
  if(!cloud.ready){ app.innerHTML = renderHeader() + renderLoading(); return; }
  var html = renderHeader() + renderTabs();
  if(ui.tab === 'plan') html += renderPlanTab();
  else if(ui.tab === 'box') html += renderBoxTab();
  else if(ui.tab === 'ingredients') html += renderIngredientsTab();
  else html += renderListTab();
  html += '<p class="wp-footer-note">Synchronisiert automatisch über alle Geräte hinweg, die diese Datei mit derselben Konfiguration öffnen.</p>';
  app.innerHTML = html;
  if(ui.modal) app.insertAdjacentHTML('beforeend', renderModal());
  if(ui.ingEdit) app.insertAdjacentHTML('beforeend', renderIngEditModal());
  if(ui.confirmMerge) app.insertAdjacentHTML('beforeend', renderConfirmMergeModal());
}
function update(){
  var active = document.activeElement;
  var activeId = active && active.id;
  var selStart = null, selEnd = null;
  if(active && typeof active.selectionStart === 'number'){ selStart = active.selectionStart; selEnd = active.selectionEnd; }
  saveState();
  render();
  if(activeId){
    var el = document.getElementById(activeId);
    if(el){
      el.focus();
      if(selStart !== null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

// ---- Events ----
document.addEventListener('click', function(e){
  if(e.target.id === 'modalBackdrop'){ ui.modal = null; update(); return; }
  if(e.target.id === 'ingEditBackdrop'){ ui.ingEdit = null; update(); return; }
  var closedSuggest = false;
  if(ui.modal && ui.modal.activeSuggestIdx != null){
    var activeInput = document.getElementById('ing-name-' + ui.modal.activeSuggestIdx);
    var withinSuggest = e.target.closest('.wp-ing-suggest');
    if(e.target !== activeInput && !withinSuggest){
      ui.modal.activeSuggestIdx = null;
      closedSuggest = true;
    }
  }
  var el = e.target.closest('[data-action]');
  if(!el){ if(closedSuggest) update(); return; }
  var action = el.dataset.action;
  switch(action){
    case 'tab': ui.tab = el.dataset.tab; ui.openDay = null; break;
    case 'weekview': ui.weekView = el.dataset.view; ui.openDay = null; ui.daySearch = ''; break;
    case 'switch-week': switchWeek(); break;
    case 'persons-minus': plan.persons = Math.max(1, plan.persons - 1); break;
    case 'persons-plus': plan.persons += 1; break;
    case 'toggle-day': { var day = el.dataset.day; ui.openDay = ui.openDay === day ? null : day; ui.daySearch = ''; break; }
    case 'add-recipe-day': { addRecipeToDay(el.dataset.day, el.dataset.recipe); break; }
    case 'remove-recipe-day': { removeRecipeFromDay(el.dataset.day, el.dataset.recipe); break; }
    case 'clear-day': { clearDay(el.dataset.day); break; }
    case 'add-new-for-day': { openAddModal(el.dataset.day, ui.daySearch); break; }
    case 'open-add-recipe': openAddModal(); break;
    case 'open-edit-recipe': { var r = recipes.find(function(x){ return x.id === el.dataset.recipe; }); if(r) openEditModal(r); break; }
    case 'modal-close': ui.modal = null; break;
    case 'modal-save': saveModal(); break;
    case 'modal-delete': deleteRecipeFromModal(); break;
    case 'add-ingredient': ui.modal.ingredients.push({ id: uid('ing'), name: '', amount: '', unit: 'Stück', category: 'Sonstiges', pkg: null }); break;
    case 'remove-ingredient': { var idx = +el.dataset.idx; ui.modal.ingredients.splice(idx, 1); break; }
    case 'pick-ingredient': { pickIngredientSuggestion(+el.dataset.idx, el.dataset.ingid); break; }
    case 'toggle-checked': { var key = el.dataset.key; ui.checked[key] = !ui.checked[key]; break; }
    case 'open-add-ing': openIngEdit(null); break;
    case 'open-edit-ing': { var item = ingredientDB.find(function(x){ return x.id === el.dataset.ingid; }); if(item) openIngEdit(item); break; }
    case 'ing-edit-close': ui.ingEdit = null; break;
    case 'ing-edit-save': saveIngEdit(); break;
    case 'ing-edit-delete': deleteIngEdit(); break;
    case 'toggle-merge': { var mid = el.dataset.ingid; ui.mergeOpenId = ui.mergeOpenId === mid ? null : mid; break; }
    case 'request-merge': {
      var fromId = el.dataset.ingid;
      var select = document.getElementById('merge-target-' + fromId);
      if(select && select.value){ ui.confirmMerge = { fromId: fromId, toId: select.value }; }
      break;
    }
    case 'cancel-merge': ui.confirmMerge = null; break;
    case 'confirm-merge': confirmMergeExecute(); break;
    default: return;
  }
  update();
});

document.addEventListener('input', function(e){
  var el = e.target;
  if(el.id === 'daySearchInput'){ ui.daySearch = el.value; update(); return; }
  if(el.id === 'boxSearchInput'){ ui.boxSearch = el.value; update(); return; }
  if(el.id === 'ingSearchInput'){ ui.ingSearch = el.value; update(); return; }
  if(ui.ingEdit){
    if(el.id === 'ingEditName'){ ui.ingEdit.name = el.value; update(); return; }
    if(el.id === 'ingEditPkg'){ ui.ingEdit.pkg = el.value; update(); return; }
  }
  if(!ui.modal) return;
  if(el.id === 'modalName'){ ui.modal.name = el.value; update(); return; }
  if(el.id === 'modalAddedBy'){ ui.modal.addedBy = el.value; update(); return; }
  if(el.id === 'modalServings'){ ui.modal.servings = el.value; update(); return; }
  if(el.id === 'modalTags'){ ui.modal.tagsText = el.value; update(); return; }
  if(el.id === 'modalUrl'){ ui.modal.url = el.value; update(); return; }
  var field = el.dataset.field;
  if(field && el.dataset.idx !== undefined){
    var idx = +el.dataset.idx;
    if(field === 'ing-name'){ ui.modal.ingredients[idx].name = el.value; ui.modal.activeSuggestIdx = el.value.trim() ? idx : null; update(); }
    else if(field === 'ing-amount'){ ui.modal.ingredients[idx].amount = el.value; update(); }
    else if(field === 'ing-pkg'){ ui.modal.ingredients[idx].pkg = el.value; update(); }
  }
});

document.addEventListener('change', function(e){
  var el = e.target;
  if(el.matches('[data-action="sugg-assign"]')){
    var day = el.value, rid = el.dataset.recipe;
    if(day){ addRecipeToDay(day, rid); update(); }
    return;
  }
  if(ui.ingEdit){
    if(el.id === 'ingEditUnit'){ ui.ingEdit.unit = el.value; update(); return; }
    if(el.id === 'ingEditCategory'){ ui.ingEdit.category = el.value; update(); return; }
  }
  if(!ui.modal) return;
  var field = el.dataset.field;
  if(field && el.dataset.idx !== undefined){
    var idx = +el.dataset.idx;
    if(field === 'ing-unit'){ ui.modal.ingredients[idx].unit = el.value; update(); }
    else if(field === 'ing-cat'){ ui.modal.ingredients[idx].category = el.value; update(); }
  }
});

render();
initCloud();
</script>
</body>
</html>
